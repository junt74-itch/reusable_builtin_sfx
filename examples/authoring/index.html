<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>効果音ガチャ</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <h1>効果音ガチャ</h1>
      <ol class="steps">
        <li>カテゴリを選んで <strong>引く</strong>（Space）</li>
        <li>気に入ったら <strong>このコードをコピー</strong> してゲームに貼る</li>
        <li>必要なら下の <strong>詳細を編集</strong></li>
      </ol>
      <p class="meta">sampleRate: <strong id="sample-rate"></strong> Hz</p>

      <section class="controls" aria-label="ガチャ">
        <label class="field">
          <span>カテゴリ</span>
          <select id="category"></select>
        </label>
        <p id="category-hint" class="category-hint"></p>
        <fieldset class="field amounts">
          <legend>揺れ幅</legend>
          <label><input type="radio" name="amount" value="0.2" /> 弱</label>
          <label><input type="radio" name="amount" value="0.45" checked /> 中</label>
          <label><input type="radio" name="amount" value="0.75" /> 強</label>
        </fieldset>
        <div class="actions">
          <button type="button" id="draw">引く</button>
          <button type="button" id="play-base" class="secondary">ベースを再生</button>
        </div>
      </section>

      <section class="copy-section" aria-label="ゲームに貼るコード">
        <h2>ゲームに貼るコード</h2>
        <p id="copy-meta" class="copy-meta">まだありません。カテゴリを選んで引いてください。</p>
        <pre id="copy-preview" class="copy-preview">await sfx.play("ui.select");</pre>
        <div class="copy-actions">
          <button type="button" id="copy-ts-selected" disabled>このコードをコピー</button>
          <button type="button" id="copy-json-selected" class="secondary" disabled>JSONをコピー</button>
          <button type="button" id="download-wav-selected" class="secondary" disabled>WAVを保存</button>
        </div>
      </section>

      <p id="status" class="status" role="status"></p>

      <section class="history-section" aria-label="履歴">
        <div class="history-header">
          <h2>履歴</h2>
          <button type="button" id="clear-history" class="secondary">履歴を消す</button>
        </div>
        <ul id="history" class="history"></ul>
      </section>

      <details class="editor-section" aria-label="詳細を編集">
        <summary>詳細を編集</summary>
        <p id="editor-meta" class="editor-meta">履歴から 1 件選ぶか、引いた直後に編集できます。</p>
        <div id="editor-fields" class="editor-fields hidden"></div>
        <div id="editor-actions" class="editor-actions hidden">
          <button type="button" id="add-edited">手編集を履歴に残す</button>
        </div>
      </details>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
